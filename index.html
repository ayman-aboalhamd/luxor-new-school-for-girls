<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الأقصر الإعدادية بنات الجديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E33;
    --paper:#F6F2E9;
    --panel:#FFFFFF;
    --teal:#1F4B4C;
    --teal-deep:#153435;
    --brass:#B8863B;
    --brass-soft:#EADFC5;
    --line:#DED4BE;
    --muted:#6E7C7E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .hero{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:64px 20px 120px;
    position:relative;
    z-index:0;
    overflow:hidden;
    text-align:center;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-80px; top:-80px;
    width:280px; height:280px;
    border:1px solid rgba(246,242,233,.14);
    border-radius:50%;
  }
  .hero::before{
    content:"";
    position:absolute;
    left:-60px; bottom:-90px;
    width:220px; height:220px;
    border:1px solid rgba(246,242,233,.1);
    border-radius:50%;
  }
  .hero-inner{max-width:640px;margin:0 auto;position:relative;}
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:14px;
    color:var(--brass-soft);
    letter-spacing:.04em;
    margin:0 0 14px;
  }
  h1.school-name{
    font-family:'Cairo',sans-serif;
    font-size:clamp(34px,7.5vw,58px);
    font-weight:900;
    color:var(--brass-soft);
    letter-spacing:.01em;
    margin:0;
    line-height:1.35;
  }
  .hero-sub{
    margin:16px 0 0;
    color:#CBD8D6;
    font-size:15px;
    line-height:1.7;
  }

  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:0 20px;
  }
  .card{
    width:100%;
    max-width:480px;
    margin-top:-72px;
    margin-bottom:40px;
    background:var(--panel);
    border-radius:16px;
    box-shadow:0 20px 44px rgba(21,52,53,.18);
    padding:32px 26px 30px;
    position:relative;
    z-index:1;
  }
  .card-label{
    font-size:14px;
    color:var(--muted);
    font-weight:500;
    margin:0 0 10px;
  }

  .quick-links{
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .quick-links a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 16px;
    background:#FCFAF4;
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--teal-deep);
    text-decoration:none;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:14px;
    transition:border-color .15s, background .15s;
  }
  .quick-links a:hover{border-color:var(--teal);background:#F3F0E4;}
  .quick-links a .arrow{color:var(--brass);font-size:18px;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:0 20px 28px;
  }

  .page-content-hidden{display:none;}
  .auth-gate{
    position:fixed; inset:0; z-index:9999;
    background:var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .auth-box{
    background:var(--panel);
    border-radius:14px;
    padding:32px 26px;
    max-width:340px;
    width:100%;
    box-shadow:0 20px 44px rgba(21,52,53,.25);
    text-align:center;
  }
  .auth-eyebrow{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--teal-deep);
    margin:0 0 18px;
  }
  .auth-box label{display:block;text-align:right;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .auth-box input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    margin-bottom:14px;
    outline:none;
    box-sizing:border-box;
  }
  .auth-box input:focus{border-color:var(--teal);}
  .auth-box button{
    width:100%;
    padding:12px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:9px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .auth-box button:hover{background:var(--teal-deep);}
  .auth-error{display:none;color:#B4432F;font-size:13px;margin:10px 0 0;}
  @media (max-width:480px){
    .hero{padding:48px 18px 100px;}
    .card{padding:26px 20px 24px;margin-top:-64px;}
  }
</style>
</head>
<body>
<div id="pageContent">

<div class="hero">
  <div class="hero-inner">
    <p class="eyebrow">النظام الإلكتروني للجداول</p>
    <h1 class="school-name">مدرسة الأقصر الإعدادية بنات الجديدة</h1>
    <p class="hero-sub">اختر من هنا الجدول اللي محتاجه</p>
  </div>
</div>

<main>
  <div class="card">
    <p class="card-label">اختر الصفحة</p>
    <div class="quick-links">
      <a href="general_table.html">الجدول العام <span class="arrow">←</span></a>
      <a href="general_teachers.html">الجدول العام للمعلمين <span class="arrow">←</span></a>
      <a href="supervisor.html">جدول الإشراف اليومي <span class="arrow">←</span></a>
      <a href="teachers.html">جداول المعلمين <span class="arrow">←</span></a>
      <a href="classes.html">جداول الفصول <span class="arrow">←</span></a>
    </div>
  </div>
</main>

<footer>مدرسة الأقصر الإعدادية بنات الجديدة</footer>

</div>
</body>
</html>
