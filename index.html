<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الأقصر الإعدادية بنات الجديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E33;
    --paper:#F6F2E9;
    --panel:#FFFFFF;
    --teal:#1F4B4C;
    --teal-deep:#153435;
    --brass:#B8863B;
    --brass-soft:#EADFC5;
    --line:#DED4BE;
    --muted:#6E7C7E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:22px 20px 60px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border:1px solid rgba(246,242,233,.14);
    border-radius:50%;
  }
  .topbar::before{
    content:"";
    position:absolute;
    right:10px; top:40px;
    width:130px; height:130px;
    border:1px solid rgba(246,242,233,.1);
    border-radius:50%;
  }
  .topbar-inner{max-width:760px;margin:0 auto;position:relative;}
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    color:var(--brass-soft);
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  h1.school-name{
    font-family:'Cairo',sans-serif;
    font-size:clamp(28px,6vw,42px);
    font-weight:800;
    color:#F6F2E9;
    letter-spacing:.01em;
    margin:0;
    line-height:1.3;
  }
  .card{
    max-width:760px;
    margin:-38px auto 40px;
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 18px 40px rgba(21,52,53,.16);
    padding:26px 22px 30px;
    position:relative;
  }

  .picker{display:flex;flex-direction:column;gap:10px;}
  label{font-size:14px;color:var(--muted);font-weight:500;}
  .search-wrap{position:relative;}
  input[type="text"]{
    width:100%;
    padding:13px 14px 13px 40px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    background:#FCFAF4;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input[type="text"]:focus{border-color:var(--teal);}
  .search-wrap svg{pointer-events:none;}
  #comboToggle{
    position:absolute;
    left:6px; top:50%;
    transform:translateY(-50%);
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, transform .15s;
  }
  #comboToggle:hover{background:var(--brass-soft);}
  #comboToggle.open svg{transform:rotate(180deg);}
  #comboToggle svg{transition:transform .15s;}

  .results{
    margin-top:4px;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    background:#FCFAF4;
    display:none;
    max-height:260px;
    overflow-y:auto;
  }
  .results.show{display:block;}
  .result-item{
    padding:11px 14px;
    cursor:pointer;
    font-size:15px;
    border-bottom:1px solid var(--line);
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:hover, .result-item.active{background:var(--brass-soft);}

  .empty-hint{
    margin-top:22px;
    padding:26px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    border:1.5px dashed var(--line);
    border-radius:10px;
  }

  .teacher-head{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:26px 0 16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--brass-soft);
  }
  .teacher-name{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--teal-deep);
    text-align:center;
  }

  .sched-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
  .sign-line{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    margin:14px 2px 0;
    font-size:13px;
    color:var(--muted);
    font-family:'Tajawal',sans-serif;
  }
  .sign-line .date-part{text-align:right;}
  .sign-line .committee-part{text-align:center;}
  .sign-line .principal-part{text-align:left;}
  table.sched{
    border-collapse:collapse;
    width:100%;
    min-width:560px;
    font-size:13.5px;
  }
  table.sched th, table.sched td{
    border:1px solid var(--line);
    padding:9px 6px;
    text-align:center;
    vertical-align:middle;
  }
  table.sched thead th{
    background:var(--teal-deep);
    color:#F6F2E9;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 6px;
  }
  table.sched th.day-col{
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13.5px;
    width:92px;
  }
  table.sched td{background:#FCFAF4;color:var(--ink);}
  table.sched td.filled{
    background:#EEF3EC;
    font-weight:600;
    color:var(--teal-deep);
  }
  table.sched td .cls{display:block;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;}
  table.sched td .subj{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;}
  table.sched td.filled .subj{color:#3F6350;}
  table.sched td.meeting{background:var(--brass-soft);color:#7A5518;font-weight:600;font-size:12px;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:0 20px 40px;
  }

  @media (max-width:480px){
    .card{margin-top:-30px;padding:20px 16px 24px;border-radius:11px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <p class="eyebrow">جدول الحصص الأسبوعي</p>
    <h1 class="school-name">مدرسة الأقصر الإعدادية بنات الجديدة</h1>
  </div>
</div>

<div class="card">
  <div class="picker">
    <label for="search">اسم المدرس / المدرسة</label>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="اختر أو اكتب اسمك..." autocomplete="off">
      <button type="button" id="comboToggle" aria-label="عرض القائمة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1B2E33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="results" id="results"></div>
  </div>

  <div id="emptyHint" class="empty-hint">لسه محددتش اسم — اكتب في المربع فوق واختار اسمك من القايمة.</div>

  <div id="scheduleArea" style="display:none;">
    <div class="teacher-head">
      <div class="teacher-name" id="teacherName"></div>
    </div>
    <div class="sched-scroll">
      <table class="sched" id="schedTable"></table>
    </div>
    <p class="sign-line">
      <span class="date-part">تاريخ العمل بالجدول/ 2026-09-12</span>
      <span class="committee-part">لجنة الجدول/ رمضان بكري</span>
      <span class="principal-part">مدير المدرسة/ احمد عطيتو</span>
    </p>
  </div>
</div>

<footer>عدد المدرسين المسجلين: <span id="teacherCount"></span></footer>

const searchEl = document.getElementById('search');

const comboToggle = document.getElementById('comboToggle');
const emptyHint = document.getElementById('emptyHint');
const scheduleArea = document.getElementById('scheduleArea');
const teacherNameEl = document.getElementById('teacherName');
const schedTable = document.getElementById('schedTable');
document.getElementById('teacherCount').textContent = NAMES.length;

let currentTeacher = null;

function renderTable(name){
  const sched = DATA[name];
  let html = '<thead><tr><th class="day-col"></th>';
  for(const p of PERIODS){ html += `<th>${p}</th>`; }
  html += '</tr></thead><tbody>';
  for(const d of DAYS){
    html += `<tr><th class="day-col">${d}</th>`;
    for(const p of PERIODS){
      const val = sched[d] && sched[d][p];
      if(val && val.trim()){
        if(val.indexOf('اجتماع') !== -1){
          html += `<td class="meeting">${val}</td>`;
        } else {
          const parts = val.split(' ');
          const cls = parts[0];
          const subj = parts.slice(1).join(' ');
          html += `<td class="filled"><span class="cls" dir="ltr">${cls}</span><span class="subj">${subj}</span></td>`;
        }
      } else {
        html += `<td>—</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  schedTable.innerHTML = html;
}

function selectTeacher(name, updateUrl){
  if(!DATA.hasOwnProperty(name)) return;
  currentTeacher = name;
  teacherNameEl.textContent = name;
  renderTable(name);
  emptyHint.style.display = 'none';
  scheduleArea.style.display = 'block';
  resultsEl.classList.remove('show');
  comboToggle.classList.remove('open');
  searchEl.value = name;
  if(updateUrl !== false){
    const url = new URL(window.location.href);
    url.searchParams.set('t', name);
    window.history.replaceState({}, '', url);
  }
}

function showResults(query){
  const q = query.trim();
  const list = q ? NAMES.filter(n => n.indexOf(q) !== -1) : NAMES.slice();
  if(list.length === 0){
    resultsEl.innerHTML = '<div class="result-item" style="color:#6E7C7E;cursor:default;">مفيش نتايج مطابقة</div>';
    resultsEl.classList.add('show');
    openCombo();
    return;
  }
  resultsEl.innerHTML = list.map(n => `<div class="result-item" data-name="${n}">${n}</div>`).join('');
  resultsEl.classList.add('show');
  openCombo();
}

function openCombo(){ comboToggle.classList.add('open'); }
function closeCombo(){
  resultsEl.classList.remove('show');
  comboToggle.classList.remove('open');
}

searchEl.addEventListener('input', (e) => showResults(e.target.value));
searchEl.addEventListener('focus', (e) => {
  e.target.select();
  showResults('');
});
comboToggle.addEventListener('click', () => {
  if(resultsEl.classList.contains('show')){
    closeCombo();
  } else {
    searchEl.focus();
    searchEl.select();
    showResults('');
  }
});
document.addEventListener('click', (e) => {
  if(!e.target.closest('.picker')){ closeCombo(); }
});
resultsEl.addEventListener('click', (e) => {
  const item = e.target.closest('.result-item');
  if(item && item.dataset.name){ selectTeacher(item.dataset.name); }
});

// On load: check ?t= param
(function init(){
  const params = new URLSearchParams(window.location.search);
  const t = params.get('t');
  if(t && DATA.hasOwnProperty(t)){
    selectTeacher(t, false);
  } else if (t) {
    const match = NAMES.find(n => n.indexOf(t) !== -1);
    if(match) selectTeacher(match, false);
  }
})();
