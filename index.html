<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول حصص المدرسين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E33;
    --paper:#F6F2E9;
    --panel:#FFFFFF;
    --teal:#1F4B4C;
    --teal-deep:#153435;
    --brass:#B8863B;
    --brass-soft:#EADFC5;
    --line:#DED4BE;
    --muted:#6E7C7E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:22px 20px 60px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border:1px solid rgba(246,242,233,.14);
    border-radius:50%;
  }
  .topbar::before{
    content:"";
    position:absolute;
    right:10px; top:40px;
    width:130px; height:130px;
    border:1px solid rgba(246,242,233,.1);
    border-radius:50%;
  }
  .topbar-inner{max-width:760px;margin:0 auto;position:relative;}
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    color:var(--brass-soft);
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  h1{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:clamp(24px,4.5vw,32px);
    margin:0;
    line-height:1.3;
  }
  .sub{
    margin:10px 0 0;
    color:#CBD8D6;
    font-size:15px;
    max-width:46ch;
    line-height:1.7;
  }

  .card{
    max-width:760px;
    margin:-38px auto 40px;
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 18px 40px rgba(21,52,53,.16);
    padding:26px 22px 30px;
    position:relative;
  }

  .picker{display:flex;flex-direction:column;gap:10px;}
  label{font-size:14px;color:var(--muted);font-weight:500;}
  .search-wrap{position:relative;}
  input[type="text"]{
    width:100%;
    padding:13px 44px 13px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    background:#FCFAF4;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input[type="text"]:focus{border-color:var(--teal);}
  .search-wrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.45;}

  .results{
    margin-top:4px;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    background:#FCFAF4;
    display:none;
    max-height:260px;
    overflow-y:auto;
  }
  .results.show{display:block;}
  .result-item{
    padding:11px 14px;
    cursor:pointer;
    font-size:15px;
    border-bottom:1px solid var(--line);
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:hover, .result-item.active{background:var(--brass-soft);}

  .empty-hint{
    margin-top:22px;
    padding:26px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    border:1.5px dashed var(--line);
    border-radius:10px;
  }

  .teacher-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:26px 0 16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--brass-soft);
  }
  .teacher-name{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--teal-deep);
  }
  .share-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:9px 14px;
    border-radius:8px;
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .share-btn:hover{background:var(--teal-deep);}
  .share-btn.copied{background:#3F7A56;}

  .sched-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
  table.sched{
    border-collapse:collapse;
    width:100%;
    min-width:560px;
    font-size:13.5px;
  }
  table.sched th, table.sched td{
    border:1px solid var(--line);
    padding:9px 6px;
    text-align:center;
    vertical-align:middle;
  }
  table.sched thead th{
    background:var(--teal-deep);
    color:#F6F2E9;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 6px;
  }
  table.sched th.period-col{
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:12.5px;
    width:92px;
    line-height:1.5;
  }
  table.sched th.period-col .t{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:2px;}
  table.sched td{background:#FCFAF4;color:var(--ink);}
  table.sched td.filled{
    background:#EEF3EC;
    font-weight:600;
    color:var(--teal-deep);
  }
  table.sched td .cls{display:block;font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;}
  table.sched td .subj{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;}
  table.sched td.filled .subj{color:#3F6350;}
  table.sched td.meeting{background:var(--brass-soft);color:#7A5518;font-weight:600;font-size:12px;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:0 20px 40px;
  }

  @media (max-width:480px){
    .card{margin-top:-30px;padding:20px 16px 24px;border-radius:11px;}
    .teacher-head{flex-direction:column;align-items:stretch;}
    .share-btn{justify-content:center;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <p class="eyebrow">جدول الحصص الأسبوعي</p>
    <h1>ابحث عن اسمك واعرف جدولك</h1>
    <p class="sub">اكتب اسمك في المربع تحت، أو افتح اللينك اللي اتبعتلك مباشرة وهيظهرلك جدولك.</p>
  </div>
</div>

<div class="card">
  <div class="picker">
    <label for="search">اسم المدرس / المدرسة</label>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="اكتب جزء من الاسم..." autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#1B2E33" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#1B2E33" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="results" id="results"></div>
  </div>

  <div id="emptyHint" class="empty-hint">لسه محددتش اسم — اكتب في المربع فوق واختار اسمك من القايمة.</div>

  <div id="scheduleArea" style="display:none;">
    <div class="teacher-head">
      <div class="teacher-name" id="teacherName"></div>
      <button class="share-btn" id="shareBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M8.6 13.5l6.8-4M8.6 10.5l6.8 4M18 6a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 24a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.6"/></svg>
        نسخ لينك المدرس ده
      </button>
    </div>
    <div class="sched-scroll">
      <table class="sched" id="schedTable"></table>
    </div>
  </div>
</div>

<footer>عدد المدرسين المسجلين: <span id="teacherCount"></span></footer>

const searchEl = document.getElementById('search');

const schedTable = document.getElementById('schedTable');
const shareBtn = document.getElementById('shareBtn');
document.getElementById('teacherCount').textContent = NAMES.length;

let currentTeacher = null;

function renderTable(name){
  const sched = DATA[name];
  let html = '<thead><tr><th class="period-col"></th>';
  for(const d of DAYS){ html += `<th>${d}</th>`; }
  html += '</tr></thead><tbody>';
  for(const p of PERIODS){
    html += `<tr><th class="period-col">${p}<span class="t">${TIMES[p]}</span></th>`;
    for(const d of DAYS){
      const val = sched[d] && sched[d][p];
      if(val && val.trim()){
        if(val.indexOf('اجتماع') !== -1){
          html += `<td class="meeting">${val}</td>`;
        } else {
          const parts = val.split(' ');
          const cls = parts[0];
          const subj = parts.slice(1).join(' ');
          html += `<td class="filled"><span class="cls">${cls}</span><span class="subj">${subj}</span></td>`;
        }
      } else {
        html += `<td>—</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  schedTable.innerHTML = html;
}

function selectTeacher(name, updateUrl){
  if(!DATA.hasOwnProperty(name)) return;
  currentTeacher = name;
  teacherNameEl.textContent = name;
  renderTable(name);
  emptyHint.style.display = 'none';
  scheduleArea.style.display = 'block';
  resultsEl.classList.remove('show');
  searchEl.value = name;
  shareBtn.classList.remove('copied');
  if(updateUrl !== false){
    const url = new URL(window.location.href);
    url.searchParams.set('t', name);
    window.history.replaceState({}, '', url);
  }
}

function showResults(query){
  const q = query.trim();
  if(!q){ resultsEl.classList.remove('show'); resultsEl.innerHTML=''; return; }
  const matches = NAMES.filter(n => n.indexOf(q) !== -1).slice(0, 12);
  if(matches.length === 0){
    resultsEl.innerHTML = '<div class="result-item" style="color:#6E7C7E;cursor:default;">مفيش نتايج مطابقة</div>';
    resultsEl.classList.add('show');
    return;
  }
  resultsEl.innerHTML = matches.map(n => `<div class="result-item" data-name="${n}">${n}</div>`).join('');
  resultsEl.classList.add('show');
}

searchEl.addEventListener('input', (e) => showResults(e.target.value));
searchEl.addEventListener('focus', (e) => { if(e.target.value.trim()) showResults(e.target.value); });
document.addEventListener('click', (e) => {
  if(!e.target.closest('.picker')){ resultsEl.classList.remove('show'); }
});
resultsEl.addEventListener('click', (e) => {
  const item = e.target.closest('.result-item');
  if(item && item.dataset.name){ selectTeacher(item.dataset.name); }
});

shareBtn.addEventListener('click', () => {
  if(!currentTeacher) return;
  const url = new URL(window.location.href);
  url.searchParams.set('t', currentTeacher);
  navigator.clipboard.writeText(url.toString()).then(() => {
    const original = shareBtn.innerHTML;
    shareBtn.classList.add('copied');
    shareBtn.innerHTML = 'تم نسخ اللينك ✓';
    setTimeout(() => { shareBtn.classList.remove('copied'); shareBtn.innerHTML = original; }, 1800);
  }).catch(() => {
    prompt('انسخ اللينك ده:', url.toString());
  });
});

// On load: check ?t= param
(function init(){
  const params = new URLSearchParams(window.location.search);
  const t = params.get('t');
  if(t && DATA.hasOwnProperty(t)){
    selectTeacher(t, false);
  } else if (t) {
    // fuzzy fallback: try partial match
    const match = NAMES.find(n => n.indexOf(t) !== -1);
    if(match) selectTeacher(match, false);
  }
})();
