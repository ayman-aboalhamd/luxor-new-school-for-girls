<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الأقصر الإعدادية بنات الجديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E33;
    --paper:#F6F2E9;
    --panel:#FFFFFF;
    --teal:#1F4B4C;
    --teal-deep:#153435;
    --brass:#B8863B;
    --brass-soft:#EADFC5;
    --line:#DED4BE;
    --muted:#6E7C7E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:22px 20px 60px;
    position:relative;
    z-index:0;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border:1px solid rgba(246,242,233,.14);
    border-radius:50%;
  }
  .topbar::before{
    content:"";
    position:absolute;
    right:10px; top:40px;
    width:130px; height:130px;
    border:1px solid rgba(246,242,233,.1);
    border-radius:50%;
  }
  .topbar-inner{max-width:760px;margin:0 auto;position:relative;}
  .home-link{
    display:block;
    text-align:right;
    margin:0 0 16px;
    color:var(--brass-soft);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:16px;
    text-decoration:none;
  }
  .home-link:hover{color:#fff;text-decoration:underline;}
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    color:var(--brass-soft);
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  h1.school-name{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:clamp(24px,4.5vw,32px);
    margin:0;
    line-height:1.3;
    color:#F6F2E9;
  }

  .card{
    max-width:760px;
    margin:-38px auto 40px;
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 18px 40px rgba(21,52,53,.16);
    padding:26px 22px 30px;
    position:relative;
    z-index:1;
  }

  .picker{display:flex;flex-direction:column;gap:10px;}
  label{font-size:14px;color:var(--muted);font-weight:500;}
  .search-wrap{position:relative;}
  input[type="text"]{
    width:100%;
    padding:13px 14px 13px 40px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    background:#FCFAF4;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input[type="text"]:focus{border-color:var(--teal);}
  #comboToggle{
    position:absolute;
    left:6px; top:50%;
    transform:translateY(-50%);
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, transform .15s;
  }
  #comboToggle:hover{background:var(--brass-soft);}
  #comboToggle.open svg{transform:rotate(180deg);}
  #comboToggle svg{transition:transform .15s;}

  .results{
    margin-top:4px;
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    background:#FCFAF4;
    display:none;
    max-height:260px;
    overflow-y:auto;
  }
  .results.show{display:block;}
  .result-item{
    padding:11px 14px;
    cursor:pointer;
    font-size:15px;
    border-bottom:1px solid var(--line);
  }
  .result-item:last-child{border-bottom:none;}
  .result-item:hover, .result-item.active{background:var(--brass-soft);}

  .empty-hint{
    margin-top:22px;
    padding:26px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    border:1.5px dashed var(--line);
    border-radius:10px;
  }

  .class-head{
    text-align:center;
    margin:26px 0 16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--brass-soft);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--teal-deep);
  }

  .sched-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
  table.sched{
    border-collapse:collapse;
    width:100%;
    min-width:560px;
    font-size:13.5px;
  }
  table.sched th, table.sched td{
    border:1px solid var(--line);
    padding:9px 6px;
    text-align:center;
    vertical-align:middle;
  }
  table.sched thead th{
    background:var(--teal-deep);
    color:#F6F2E9;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 6px;
  }
  table.sched th.day-col{
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13.5px;
    width:92px;
  }
  table.sched td{background:#FCFAF4;color:var(--ink);}
  table.sched td.filled{
    background:#EEF3EC;
    font-weight:700;
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-size:13.5px;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:0 20px 40px;
  }

  @media (max-width:480px){
    .card{margin-top:-30px;padding:20px 16px 24px;border-radius:11px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="home-link" href="index.html">→ الصفحة الرئيسية</a>
    <p class="eyebrow">جدول الفصول</p>
    <h1 class="school-name">مدرسة الأقصر الإعدادية بنات الجديدة</h1>
  </div>
</div>

<div class="card">
  <div class="picker">
    <label for="search">الفصل</label>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="اختر أو اكتب رقم الفصل..." autocomplete="off">
      <button type="button" id="comboToggle" aria-label="عرض القائمة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#1B2E33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="results" id="results"></div>
  </div>

  <div id="emptyHint" class="empty-hint">لسه محددتش فصل — اكتب أو اختار رقم الفصل فوق.</div>

  <div id="classArea" style="display:none;">
    <div class="class-head" id="classTitle"></div>
    <div class="sched-scroll">
      <table class="sched" id="schedTable"></table>
    </div>
  </div>
</div>

<footer>عدد الفصول: <span id="classCount"></span></footer>

", "الأولى": "انجليزي"}}};
const DAYS = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
const PERIODS = ["الأولى", "الثانية", "الثالثة", "الرابعة", "الخامسة", "السادسة", "السابعة", "الثامنة"];
const CLASSES = ["١/١", "٢/١", "٣/١", "٤/١", "٥/١", "٦/١", "٧/١", "٨/١", "٩/١", "١/٢", "٢/٢", "٣/٢", "٤/٢", "٥/٢", "٦/٢", "٧/٢", "٨/٢", "٩/٢", "١/٣", "٢/٣", "٣/٣", "٤/٣", "٥/٣", "٦/٣", "٧/٣", "٨/٣", "٩/٣", "١٠/٣"];

const searchEl = document.getElementById('search');
const resultsEl = document.getElementById('results');
const comboToggle = document.getElementById('comboToggle');
const emptyHint = document.getElementById('emptyHint');
const classArea = document.getElementById('classArea');
const classTitle = document.getElementById('classTitle');
const schedTable = document.getElementById('schedTable');
document.getElementById('classCount').textContent = CLASSES.length;

let currentClass = null;

function renderTable(cls){
  const sched = DATA[cls] || {};
  let html = '<thead><tr><th class="day-col"></th>';
  for(const p of PERIODS){ html += `<th>${p}</th>`; }
  html += '</tr></thead><tbody>';
  for(const d of DAYS){
    html += `<tr><th class="day-col">${d}</th>`;
    for(const p of PERIODS){
      const val = sched[d] && sched[d][p];
      if(val){
        html += `<td class="filled">${val}</td>`;
      } else {
        html += `<td>—</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  schedTable.innerHTML = html;
}

function selectClass(cls, updateUrl){
  if(!DATA.hasOwnProperty(cls)) return;
  currentClass = cls;
  classTitle.textContent = cls;
  renderTable(cls);
  emptyHint.style.display = 'none';
  classArea.style.display = 'block';
  closeCombo();
  searchEl.value = cls;
  if(updateUrl !== false){
    const url = new URL(window.location.href);
    url.searchParams.set('c', cls);
    window.history.replaceState({}, '', url);
  }
}

function showResults(query){
  const q = query.trim();
  const list = q ? CLASSES.filter(c => c.indexOf(q) !== -1) : CLASSES.slice();
  if(list.length === 0){
    resultsEl.innerHTML = '<div class="result-item" style="color:#6E7C7E;cursor:default;">مفيش نتايج مطابقة</div>';
    resultsEl.classList.add('show');
    openCombo();
    return;
  }
  resultsEl.innerHTML = list.map(c => `<div class="result-item" data-class="${c}">${c}</div>`).join('');
  resultsEl.classList.add('show');
  openCombo();
}

function openCombo(){ comboToggle.classList.add('open'); }
function closeCombo(){
  resultsEl.classList.remove('show');
  comboToggle.classList.remove('open');
}

searchEl.addEventListener('input', (e) => showResults(e.target.value));
searchEl.addEventListener('focus', (e) => { e.target.select(); showResults(''); });
comboToggle.addEventListener('click', () => {
  if(resultsEl.classList.contains('show')){
    closeCombo();
  } else {
    searchEl.focus();
    searchEl.select();
    showResults('');
  }
});
document.addEventListener('click', (e) => {
  if(!e.target.closest('.picker')){ closeCombo(); }
});
resultsEl.addEventListener('click', (e) => {
  const item = e.target.closest('.result-item');
  if(item && item.dataset.class){ selectClass(item.dataset.class); }
});

(function init(){
  const params = new URLSearchParams(window.location.search);
  const c = params.get('c');
  if(c && DATA.hasOwnProperty(c)){
    selectClass(c, false);
  } else if(c){
    const match = CLASSES.find(x => x.indexOf(c) !== -1);
    if(match) selectClass(match, false);
  }
})();
</script>
