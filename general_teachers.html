<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الأقصر الإعدادية بنات الجديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E33;
    --paper:#F6F2E9;
    --panel:#FFFFFF;
    --teal:#2E6360;
    --teal-deep:#234845;
    --brass:#B8863B;
    --brass-soft:#EADFC5;
    --line:#DED4BE;
    --muted:#6E7C7E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:22px 20px 40px;
    position:relative;
    z-index:0;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border:1px solid rgba(246,242,233,.14);
    border-radius:50%;
    pointer-events:none;
  }
  .topbar::before{
    content:"";
    position:absolute;
    right:10px; top:40px;
    width:130px; height:130px;
    border:1px solid rgba(246,242,233,.1);
    border-radius:50%;
    pointer-events:none;
  }
  .topbar-inner{position:relative;z-index:2;max-width:1400px;margin:0 auto;position:relative;}
  .home-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin:0 0 16px;
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:14px;
    text-decoration:none;
    padding:8px 16px;
    border-radius:999px;
    box-shadow:0 4px 10px rgba(21,52,53,.18);
    transition:background .15s, transform .15s;
  }
  .home-link:hover{background:#fff;transform:translateY(-1px);}
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    color:var(--brass-soft);
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  h1.school-name{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:clamp(22px,4vw,30px);
    margin:0;
    line-height:1.3;
    color:#F6F2E9;
  }

  .page-wrap{
    max-width:1400px;
    margin:0 auto;
    padding:0 16px 40px;
  }

  .search-bar{
    margin:-20px 0 16px;
    position:relative;
    z-index:1;
    max-width:280px;
  }

  .disclaimer-banner{
    max-width:1400px;
    margin:14px auto 0;
    background:#FCEFD8;
    border:1.5px solid var(--brass);
    color:#7A4A12;
    border-radius:10px;
    padding:12px 18px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13px;
    text-align:center;
    line-height:1.6;
    position:relative;
    z-index:1;
  }
  .search-bar input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    background:var(--panel);
    color:var(--ink);
    outline:none;
    box-shadow:0 10px 24px rgba(21,52,53,.12);
    transition:border-color .15s;
  }
  .search-bar input:focus{border-color:var(--teal);}

  .matrix-card{
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 12px 30px rgba(21,52,53,.12);
    padding:14px;
    overflow:hidden;
  }

  .matrix-scroll{
    overflow:auto;
    border-radius:10px;
    border:1px solid var(--line);
    max-height:80vh;
  }

  table.matrix{
    border-collapse:separate;
    border-spacing:0;
    font-size:15px;
    white-space:nowrap;
  }
  table.matrix th, table.matrix td{
    border-left:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:6px 4px;
    text-align:center;
    vertical-align:middle;
  }

  table.matrix thead th.day-head{
    background:var(--teal-deep);
    color:#F6F2E9;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 6px;
    position:sticky;
    top:0;
    z-index:3;
    border-bottom:2px solid var(--brass);
  }
  table.matrix thead th.period-head{
    background:var(--teal);
    color:#F6F2E9;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:10.5px;
    padding:7px 3px;
    min-width:58px;
    position:sticky;
    top:37px;
    z-index:3;
  }
  table.matrix thead th.corner{
    background:var(--brass-soft);
    position:sticky;
    top:0;
    right:0;
    z-index:5;
    min-width:150px;
  }
  table.matrix thead th.corner.stat-col{
    right:150px;
    min-width:44px;
  }
  table.matrix thead tr:first-child th.corner{
    height:37px;
  }

  table.matrix tbody th.teacher-col{
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:12.5px;
    position:sticky;
    right:0;
    z-index:2;
    min-width:150px;
    text-align:right;
    padding-right:10px;
    border-bottom:1px solid var(--line);
  }
  table.matrix tbody td.stat-col{
    position:sticky;
    z-index:2;
    min-width:44px;
    font-weight:700;
    color:var(--teal-deep);
  }
  table.matrix tbody td.quota-col{right:150px;background:#EFE9D8;}

  table.matrix tbody tr:nth-child(odd) td{background:#FCFAF4;}
  table.matrix tbody tr:nth-child(even) td{background:#F5F1E6;}
  table.matrix tbody tr:nth-child(odd) td.stat-col{background:#EFE9D8;}
  table.matrix tbody tr:nth-child(even) td.stat-col{background:#E7E0CC;}
  table.matrix td.filled{
    font-weight:700;
    color:var(--teal-deep);
  }
  table.matrix td.empty{color:var(--line);}

  table.matrix td.day-edge, table.matrix th.day-edge{
    border-left:2px solid var(--brass);
  }

  tr.row-hidden{display:none;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:20px 20px 40px;
  }

  @media (max-width:480px){
    .topbar{padding:18px 14px 30px;}
  }
  .page-content-hidden{display:none;}
  .auth-gate{
    position:fixed; inset:0; z-index:9999;
    background:var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .auth-box{
    background:var(--panel);
    border-radius:14px;
    padding:32px 26px;
    max-width:340px;
    width:100%;
    box-shadow:0 20px 44px rgba(21,52,53,.25);
    text-align:center;
  }
  .auth-eyebrow{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--teal-deep);
    margin:0 0 18px;
  }
  .auth-box label{display:block;text-align:right;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .auth-box input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    margin-bottom:14px;
    outline:none;
    box-sizing:border-box;
  }
  .auth-box input:focus{border-color:var(--teal);}
  .auth-box button{
    width:100%;
    padding:12px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:9px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .auth-box button:hover{background:var(--teal-deep);}
  .auth-error{display:none;color:#B4432F;font-size:13px;margin:10px 0 0;}
</style>
</head>
<body>
<div id="pageContent">

<div class="topbar">
  <div class="topbar-inner">
    <a class="home-link" href="index.html">→ الصفحة الرئيسية</a>
    <p class="eyebrow">الجدول العام للمعلمين</p>
    <h1 class="school-name">مدرسة الأقصر الإعدادية بنات الجديدة</h1>
    <p class="disclaimer-banner">⚠ المعلومات المعروضة في هذه الصفحة استرشادية فقط، ولا تتحمّل المدرسة أي مسؤولية عن أي خطأ أو تعارض بها.</p>
  </div>
</div>

<div class="page-wrap">
  <div class="search-bar">
    <input type="text" id="filterInput" placeholder="فلترة باسم المدرس...">
  </div>

  <div class="matrix-card">
    <div class="matrix-scroll">
      <table class="matrix" id="matrixTable"></table>
    </div>
  </div>
</div>

<footer>تاريخ العمل بالجدول: 27-09-2026 • عدد المدرسين: <span id="teacherCount"></span></footer>
