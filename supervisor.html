<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الأقصر الإعدادية بنات الجديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2E33;
    --paper:#F6F2E9;
    --panel:#FFFFFF;
    --teal:#2E6360;
    --teal-deep:#234845;
    --brass:#B8863B;
    --brass-soft:#EADFC5;
    --line:#DED4BE;
    --muted:#6E7C7E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .topbar{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:22px 20px 60px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border:1px solid rgba(246,242,233,.14);
    border-radius:50%;
    pointer-events:none;
  }
  .topbar::before{
    content:"";
    position:absolute;
    right:10px; top:40px;
    width:130px; height:130px;
    border:1px solid rgba(246,242,233,.1);
    border-radius:50%;
    pointer-events:none;
  }
  .topbar-inner{position:relative;z-index:2;max-width:960px;margin:0 auto;position:relative;}
  .home-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin:0 0 16px;
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:14px;
    text-decoration:none;
    padding:8px 16px;
    border-radius:999px;
    box-shadow:0 4px 10px rgba(21,52,53,.18);
    transition:background .15s, transform .15s;
  }
  .home-link:hover{background:#fff;transform:translateY(-1px);}
  .eyebrow{
    font-family:'Cairo',sans-serif;
    font-size:13px;
    color:var(--brass-soft);
    letter-spacing:.02em;
    margin:0 0 6px;
  }
  h1.school-name{
    font-family:'Cairo',sans-serif;
    font-size:clamp(24px,5vw,36px);
    font-weight:800;
    color:#F6F2E9;
    letter-spacing:.01em;
    margin:0;
    line-height:1.3;
  }

  .card{
    max-width:960px;
    margin:-38px auto 40px;
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 18px 40px rgba(21,52,53,.16);
    padding:26px 22px 30px;
    position:relative;
  }

  .picker{display:flex;flex-direction:column;gap:10px;max-width:320px;}

  .disclaimer-banner{
    max-width:960px;
    margin:14px auto 0;
    background:#FCEFD8;
    border:1.5px solid var(--brass);
    color:#7A4A12;
    border-radius:10px;
    padding:12px 18px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13px;
    text-align:center;
    line-height:1.6;
    position:relative;
    z-index:1;
  }
  label{font-size:14px;color:var(--muted);font-weight:500;}
  select#daySelect{
    width:100%;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    background:#FCFAF4;
    color:var(--ink);
    outline:none;
    cursor:pointer;
  }
  select#daySelect:focus{border-color:var(--teal);}

  .day-head{
    text-align:center;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--teal-deep);
    margin:26px 0 16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--brass-soft);
  }

  .sched-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
  table.sched{
    border-collapse:collapse;
    width:100%;
    min-width:820px;
    font-size:12.5px;
  }
  table.sched th, table.sched td{
    border:1px solid var(--line);
    padding:7px 5px;
    text-align:center;
    vertical-align:middle;
  }
  table.sched thead th{
    background:var(--teal-deep);
    color:#F6F2E9;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:9px 5px;
  }
  table.sched th.class-col{
    background:var(--brass-soft);
    color:var(--teal-deep);
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:13px;
    width:64px;
  }
  table.sched td{background:#FCFAF4;color:var(--ink);}
  table.sched td.filled{background:#EEF3EC;}
  table.sched td .subj{display:block;font-family:'Cairo',sans-serif;font-weight:700;font-size:12.5px;color:var(--teal-deep);}
  table.sched td .teacher-line{display:block;font-size:10.5px;color:#3F6350;margin-top:2px;}
  table.sched td .teacher-line a{color:inherit;text-decoration:none;border-bottom:1px dashed #3F6350;}
  table.sched td .teacher-line a:hover{color:var(--teal-deep);border-bottom-color:var(--teal-deep);}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    padding:0 20px 40px;
  }

  @media (max-width:480px){
    .card{margin-top:-30px;padding:20px 16px 24px;border-radius:11px;}
  }
  .page-content-hidden{display:none;}
  .auth-gate{
    position:fixed; inset:0; z-index:9999;
    background:var(--teal-deep);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .auth-box{
    background:var(--panel);
    border-radius:14px;
    padding:32px 26px;
    max-width:340px;
    width:100%;
    box-shadow:0 20px 44px rgba(21,52,53,.25);
    text-align:center;
  }
  .auth-eyebrow{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--teal-deep);
    margin:0 0 18px;
  }
  .auth-box label{display:block;text-align:right;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .auth-box input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    margin-bottom:14px;
    outline:none;
    box-sizing:border-box;
  }
  .auth-box input:focus{border-color:var(--teal);}
  .auth-box button{
    width:100%;
    padding:12px;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:9px;
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .auth-box button:hover{background:var(--teal-deep);}
  .auth-error{display:none;color:#B4432F;font-size:13px;margin:10px 0 0;}
</style>
</head>
<body>
<div id="pageContent">

<div class="topbar">
  <div class="topbar-inner">
    <a class="home-link" href="index.html">→ الصفحة الرئيسية</a>
    <p class="eyebrow">جدول الإشراف اليومي</p>
    <h1 class="school-name">مدرسة الأقصر الإعدادية بنات الجديدة</h1>
    <p class="disclaimer-banner">⚠ المعلومات المعروضة في هذه الصفحة استرشادية فقط، ولا تتحمّل المدرسة أي مسؤولية عن أي خطأ أو تعارض بها.</p>
  </div>
</div>

<div class="card">
  <div class="picker">
    <label for="daySelect">اختر اليوم</label>
    <select id="daySelect">
      <option value="">— اختر —</option>
    </select>
  </div>

  <div id="emptyHint" class="empty-hint" style="margin-top:22px;padding:26px 18px;text-align:center;color:var(--muted);font-size:14.5px;border:1.5px dashed var(--line);border-radius:10px;">
    اختار يوم من القايمة فوق عشان تشوف جدول كل الفصول فيه.
  </div>

  <div id="dayArea" style="display:none;">
    <div class="day-head" id="dayTitle"></div>
    <div class="sched-scroll">
      <table class="sched" id="schedTable"></table>
    </div>
  </div>
</div>

<footer>تاريخ العمل بالجدول: 20-09-2026 • عدد الفصول: <span id="classCount"></span></footer>

  const trimmed = name.trim();
  if (!trimmed) return '';
  const url = TEACHER_PAGE + '?t=' + encodeURIComponent(trimmed);
  return `<a href="${url}" target="_blank" rel="noopener">${trimmed}</a>`;
}

function renderTeacherField(teacherStr) {
  if (!teacherStr) return '';
  // ممكن يكون فيه أكتر من مدرس مفصولين بـ"/" (تبديل حصص)
  return teacherStr.split('/').map(part => teacherLink(part)).join(' / ');
}

function renderDay(day) {
  const dayData = DATA[day] || {};
  let html = '<thead><tr><th class="class-col">الفصل</th>';
  for (const p of PERIODS) { html += `<th>${p}</th>`; }
  html += '</tr></thead><tbody>';
  for (const cls of CLASSES) {
    html += `<tr><th class="class-col">${cls}</th>`;
    const row = dayData[cls] || {};
    for (const p of PERIODS) {
      const cell = row[p];
      if (cell && cell.subject) {
        const teacherHtml = renderTeacherField(cell.teacher || '');
        html += `<td class="filled"><span class="subj">${cell.subject}</span>${teacherHtml ? `<span class="teacher-line">${teacherHtml}</span>` : ''}</td>`;
      } else {
        html += `<td>—</td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  schedTable.innerHTML = html;
}

function selectDay(day, updateUrl) {
  if (!DAYS.includes(day)) return;
  dayTitle.textContent = day;
  renderDay(day);
  emptyHint.style.display = 'none';
  dayArea.style.display = 'block';
  daySelect.value = day;
  if (updateUrl !== false) {
    const url = new URL(window.location.href);
    url.searchParams.set('day', day);
    window.history.replaceState({}, '', url);
  }
}

daySelect.addEventListener('change', (e) => {
  if (e.target.value) selectDay(e.target.value);
});

(function init() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('day');
  if (d && DAYS.includes(d)) selectDay(d, false);
})();
</script>

</div>
